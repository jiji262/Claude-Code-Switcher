<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude Code Switcher v2.0 — Interactive Design Prototype</title>
  <style>
/* ==========================================================================
   Claude Code Switcher v2.0 — Three-Layer Design Tokens
   Direction: Editorial Warm Precision (Obsidian Studio & Warm Parchment)
   ========================================================================== */

:root {
  /* --- Layer 1: Primitive Color Tokens --- */
  --p-stone-950: #121210;
  --p-stone-925: #171614;
  --p-stone-900: #1C1B18;
  --p-stone-850: #22211E;
  --p-stone-800: #2A2824;
  --p-stone-750: #33302B;
  --p-stone-700: #3E3A34;
  --p-stone-600: #59544B;
  --p-stone-500: #7D776C;
  --p-stone-400: #A8A195;
  --p-stone-300: #CFC9BE;
  --p-stone-200: #E3DED4;
  --p-stone-150: #ECE8DF;
  --p-stone-100: #F3F0E8;
  --p-stone-50:  #FAF8F4;
  --p-white:     #FFFFFF;

  /* Claude Terracotta Scale */
  --p-clay-700: #9E4326;
  --p-clay-600: #B85030;
  --p-clay-500: #CC6240;
  --p-clay-400: #D97757;
  --p-clay-300: #E7967B;
  --p-clay-glow-dark: rgba(217, 119, 87, 0.15);
  --p-clay-glow-light: rgba(204, 98, 64, 0.11);

  /* Instrument Signal Scales */
  --p-emerald-600: #1E8255;
  --p-emerald-500: #279663;
  --p-emerald-400: #3ECF8E;
  --p-emerald-soft-dark: rgba(62, 207, 142, 0.13);
  --p-emerald-soft-light: rgba(30, 130, 85, 0.10);

  --p-amber-600: #B2680E;
  --p-amber-400: #E6A23C;
  --p-amber-soft-dark: rgba(230, 162, 60, 0.14);
  --p-amber-soft-light: rgba(178, 104, 14, 0.11);

  --p-crimson-600: #C23A32;
  --p-crimson-400: #F06A63;
  --p-crimson-soft-dark: rgba(240, 106, 99, 0.14);
  --p-crimson-soft-light: rgba(194, 58, 50, 0.10);

  --p-sky-600: #2563EB;
  --p-sky-400: #6BA3FF;

  /* Diff Highlight Primitives */
  --p-diff-add-bg-dark: rgba(62, 207, 142, 0.11);
  --p-diff-add-fg-dark: #7CE5B4;
  --p-diff-del-bg-dark: rgba(240, 106, 99, 0.12);
  --p-diff-del-fg-dark: #F79893;

  --p-diff-add-bg-light: rgba(30, 130, 85, 0.10);
  --p-diff-add-fg-light: #166541;
  --p-diff-del-bg-light: rgba(194, 58, 50, 0.09);
  --p-diff-del-fg-light: #9E2A23;

  /* --- Layer 1: Primitive Spacing, Typography & Motion --- */
  --space-1: 4px;
  --space-1-5: 6px;
  --space-2: 8px;
  --space-2-5: 10px;
  --space-3: 12px;
  --space-3-5: 14px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;

  --radius-xs: 5px;
  --radius-sm: 7px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-pill: 999px;

  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", system-ui, sans-serif;
  --font-display: "Iowan Old Style", "Newsreader", "Georgia", "Songti SC", serif;
  --font-mono: "SF Mono", "JetBrains Mono", "Menlo", "Monaco", "Consolas", ui-monospace, monospace;

  --text-2xs: 11px;
  --text-xs: 12px;
  --text-sm: 13px;
  --text-base: 14px;
  --text-md: 15px;
  --text-lg: 18px;
  --text-xl: 21px;

  --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-fast: 140ms;
  --dur-med: 220ms;

  /* --- Layer 3: Layout & Component Dimensions --- */
  --rail-width: 298px;
  --titlebar-height: 46px;
  --statusbar-height: 29px;
  --traffic-inset-width: 74px;
  --control-sm: 28px;
  --control-md: 34px;
  --control-lg: 38px;
}

/* --- Layer 2: Semantic Tokens — Obsidian Studio (Dark Default) --- */
:root,
[data-theme="dark"] {
  color-scheme: dark;

  --bg-canvas: var(--p-stone-950);
  --bg-rail: var(--p-stone-925);
  --bg-surface: var(--p-stone-900);
  --bg-elevated: var(--p-stone-850);
  --bg-inset: #0E0E0C;
  --bg-hover: var(--p-stone-850);
  --bg-active: var(--p-stone-800);
  --bg-selected: rgba(217, 119, 87, 0.12);
  --bg-backdrop: rgba(8, 8, 7, 0.66);

  --border-subtle: #262420;
  --border-default: #312E29;
  --border-strong: #433F38;
  --border-focus: var(--p-clay-400);

  --text-primary: #F3F0E9;
  --text-secondary: #B4AEA2;
  --text-tertiary: #847E72;
  --text-on-accent: #FAF8F4;

  --accent: var(--p-clay-400);
  --accent-hover: var(--p-clay-300);
  --accent-pressed: var(--p-clay-500);
  --accent-soft: var(--p-clay-glow-dark);

  --signal-live: var(--p-emerald-400);
  --signal-live-soft: var(--p-emerald-soft-dark);
  --signal-warn: var(--p-amber-400);
  --signal-warn-soft: var(--p-amber-soft-dark);
  --signal-danger: var(--p-crimson-400);
  --signal-danger-soft: var(--p-crimson-soft-dark);
  --signal-info: var(--p-sky-400);

  --diff-add-bg: var(--p-diff-add-bg-dark);
  --diff-add-fg: var(--p-diff-add-fg-dark);
  --diff-del-bg: var(--p-diff-del-bg-dark);
  --diff-del-fg: var(--p-diff-del-fg-dark);

  --syntax-key: #E7967B;
  --syntax-str: #8FD9A8;
  --syntax-num: #E6B46A;
  --syntax-bool: #8AB4F8;
  --syntax-punc: #7D776C;

  --shadow-overlay: 0 18px 48px rgba(0, 0, 0, 0.52), 0 4px 12px rgba(0, 0, 0, 0.34);
  --shadow-toast: 0 10px 28px rgba(0, 0, 0, 0.45);
  --selection-bg: rgba(217, 119, 87, 0.28);
  --scrollbar-thumb: #36332D;
  --scrollbar-thumb-hover: #4A463E;
}

/* --- Layer 2: Semantic Tokens — Warm Parchment (Light) --- */
[data-theme="light"] {
  color-scheme: light;

  --bg-canvas: var(--p-stone-50);
  --bg-rail: var(--p-stone-100);
  --bg-surface: var(--p-white);
  --bg-elevated: var(--p-white);
  --bg-inset: #F4F1EA;
  --bg-hover: #EAE6DC;
  --bg-active: #E1DCD0;
  --bg-selected: rgba(204, 98, 64, 0.10);
  --bg-backdrop: rgba(24, 23, 21, 0.36);

  --border-subtle: #E5E0D5;
  --border-default: #D7D1C4;
  --border-strong: #BEB7A8;
  --border-focus: var(--p-clay-500);

  --text-primary: #191816;
  --text-secondary: #575248;
  --text-tertiary: #7A7367;
  --text-on-accent: #FFFFFF;

  --accent: var(--p-clay-500);
  --accent-hover: var(--p-clay-600);
  --accent-pressed: var(--p-clay-700);
  --accent-soft: var(--p-clay-glow-light);

  --signal-live: var(--p-emerald-600);
  --signal-live-soft: var(--p-emerald-soft-light);
  --signal-warn: var(--p-amber-600);
  --signal-warn-soft: var(--p-amber-soft-light);
  --signal-danger: var(--p-crimson-600);
  --signal-danger-soft: var(--p-crimson-soft-light);
  --signal-info: var(--p-sky-600);

  --diff-add-bg: var(--p-diff-add-bg-light);
  --diff-add-fg: var(--p-diff-add-fg-light);
  --diff-del-bg: var(--p-diff-del-bg-light);
  --diff-del-fg: var(--p-diff-del-fg-light);

  --syntax-key: #A84424;
  --syntax-str: #1B6E46;
  --syntax-num: #9A5B0A;
  --syntax-bool: #1D4ED8;
  --syntax-punc: #7A7367;

  --shadow-overlay: 0 18px 44px rgba(25, 24, 22, 0.16), 0 4px 12px rgba(25, 24, 22, 0.08);
  --shadow-toast: 0 8px 24px rgba(25, 24, 22, 0.13);
  --selection-bg: rgba(204, 98, 64, 0.20);
  --scrollbar-thumb: #CFC9BE;
  --scrollbar-thumb-hover: #B5AEA0;
}

/* ==========================================================================
   Claude Code Switcher v2.0 — Application Stylesheet
   Craft Floor: Zero `transition: all`, optical tracking, themed browser surfaces
   ========================================================================== */

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  height: 100%;
  overflow-x: clip;
  overflow-y: hidden;
  background: var(--bg-canvas);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: var(--text-sm);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  user-select: none;
}

::selection {
  background: var(--selection-bg);
  color: var(--text-primary);
}

::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: var(--scrollbar-thumb);
  border-radius: var(--radius-pill);
  border: 2px solid transparent;
  background-clip: content-box;
}
::-webkit-scrollbar-thumb:hover {
  background: var(--scrollbar-thumb-hover);
  border: 2px solid transparent;
  background-clip: content-box;
}

:focus-visible {
  outline: 2px solid var(--border-focus);
  outline-offset: 1px;
}

.tabular {
  font-variant-numeric: tabular-nums;
}

.mono {
  font-family: var(--font-mono);
}

/* --- App Shell Grid --- */
.app-shell {
  display: grid;
  grid-template-columns: var(--rail-width) minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr) var(--statusbar-height);
  height: 100vh;
  width: 100%;
}

/* --- Left Switchboard Rail --- */
.rail {
  grid-column: 1;
  grid-row: 1;
  background: var(--bg-rail);
  border-right: 1px solid var(--border-subtle);
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.rail-titlebar {
  height: var(--titlebar-height);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 var(--space-3) 0 var(--space-3);
  border-bottom: 1px solid var(--border-subtle);
  flex-shrink: 0;
}

.app-Shell-macos .rail-titlebar {
  padding-left: calc(var(--traffic-inset-width) + 6px);
}

.brand-lockup {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  min-width: 0;
}

.brand-mark {
  width: 22px;
  height: 22px;
  border-radius: var(--radius-xs);
  background: var(--accent);
  color: var(--text-on-accent);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.brand-mark svg {
  width: 14px;
  height: 14px;
}

.brand-title {
  font-size: var(--text-sm);
  font-weight: 600;
  letter-spacing: -0.02em;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.rail-actions {
  display: flex;
  align-items: center;
  gap: 2px;
}

/* --- Live Claude Status Card --- */
.live-card {
  margin: var(--space-3) var(--space-3) var(--space-2);
  padding: var(--space-2-5) var(--space-3);
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  display: flex;
  flex-direction: column;
  gap: var(--space-1-5);
}

.live-card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
}

.live-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: var(--text-2xs);
  font-weight: 600;
  padding: 2px 8px;
  border-radius: var(--radius-pill);
}

.live-pill.is-synced {
  background: var(--signal-live-soft);
  color: var(--signal-live);
}
.live-pill.is-drifted {
  background: var(--signal-warn-soft);
  color: var(--signal-warn);
}
.live-pill.is-missing {
  background: var(--bg-active);
  color: var(--text-secondary);
}

.pulse-dot {
  width: 6px;
  height: 6px;
  border-radius: var(--radius-pill);
  background: currentColor;
}

.live-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
  font-size: var(--text-xs);
  color: var(--text-secondary);
}

.live-host {
  font-family: var(--font-mono);
  font-size: var(--text-2xs);
  color: var(--text-primary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.live-drift-bar {
  margin-top: var(--space-1);
  padding-top: var(--space-2);
  border-top: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-1-5);
}

/* --- Search + New Profile Bar --- */
.rail-toolbar {
  padding: 0 var(--space-3) var(--space-2-5);
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

.search-box {
  position: relative;
  flex: 1;
  min-width: 0;
}

.search-box svg {
  position: absolute;
  left: 9px;
  top: 50%;
  transform: translateY(-50%);
  width: 14px;
  height: 14px;
  color: var(--text-tertiary);
  pointer-events: none;
}

.search-input {
  width: 100%;
  height: var(--control-sm);
  padding: 0 26px 0 28px;
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: var(--text-xs);
  transition: border-color var(--dur-fast) var(--ease-out-expo), background-color var(--dur-fast) var(--ease-out-expo);
}
.search-input::placeholder {
  color: var(--text-tertiary);
}
.search-input:focus {
  outline: none;
  border-color: var(--border-focus);
  background: var(--bg-elevated);
}

.search-clear {
  position: absolute;
  right: 5px;
  top: 50%;
  transform: translateY(-50%);
  width: 18px;
  height: 18px;
  border: none;
  background: transparent;
  color: var(--text-tertiary);
  cursor: pointer;
  border-radius: var(--radius-xs);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.search-clear:hover {
  color: var(--text-primary);
  background: var(--bg-hover);
}

/* --- Profile List --- */
.profile-list {
  flex: 1;
  overflow-y: auto;
  padding: 2px var(--space-2-5) var(--space-4);
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.rail-section-title {
  padding: var(--space-2) var(--space-2) var(--space-1);
  font-size: var(--text-2xs);
  font-weight: 600;
  color: var(--text-tertiary);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.profile-item {
  position: relative;
  display: grid;
  grid-template-columns: 30px minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--space-2-5);
  padding: 9px var(--space-2-5);
  border-radius: var(--radius-md);
  border: 1px solid transparent;
  background: transparent;
  cursor: pointer;
  text-align: left;
  transition: background-color var(--dur-fast) var(--ease-out-expo), border-color var(--dur-fast) var(--ease-out-expo);
}

.profile-item:hover {
  background: var(--bg-hover);
}

.profile-item.is-selected {
  background: var(--bg-surface);
  border-color: var(--border-default);
}

.profile-item.is-active-live {
  background: var(--bg-selected);
  border-color: var(--border-focus);
}

.provider-badge {
  width: 30px;
  height: 30px;
  border-radius: var(--radius-sm);
  background: var(--bg-elevated);
  border: 1px solid var(--border-subtle);
  color: var(--text-primary);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: var(--text-2xs);
  font-weight: 600;
  flex-shrink: 0;
}

.profile-item.is-active-live .provider-badge {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--text-on-accent);
}

.profile-item-body {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.profile-item-title-row {
  display: flex;
  align-items: center;
  gap: 5px;
  min-width: 0;
}

.profile-item-name {
  font-size: var(--text-sm);
  font-weight: 550;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.pin-icon {
  width: 11px;
  height: 11px;
  color: var(--accent);
  flex-shrink: 0;
}

.profile-item-sub {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: var(--text-2xs);
  color: var(--text-tertiary);
  min-width: 0;
}

.profile-item-host {
  font-family: var(--font-mono);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.profile-item-right {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.active-dot-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 7px;
  border-radius: var(--radius-pill);
  background: var(--signal-live-soft);
  color: var(--signal-live);
  font-size: var(--text-2xs);
  font-weight: 600;
  white-space: nowrap;
}

.quick-switch-btn {
  opacity: 0;
  height: 24px;
  padding: 0 8px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--border-default);
  background: var(--bg-elevated);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: var(--text-2xs);
  font-weight: 500;
  cursor: pointer;
  transition: opacity var(--dur-fast) var(--ease-out-expo), background-color var(--dur-fast) var(--ease-out-expo), border-color var(--dur-fast) var(--ease-out-expo);
}

.profile-item:hover .quick-switch-btn,
.profile-item:focus-within .quick-switch-btn {
  opacity: 1;
}

.quick-switch-btn:hover {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--text-on-accent);
}

/* --- Main Workspace --- */
.workspace {
  grid-column: 2;
  grid-row: 1;
  background: var(--bg-canvas);
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
}

.workspace-topbar {
  height: var(--titlebar-height);
  padding: 0 var(--space-5);
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
  flex-shrink: 0;
}

.topbar-breadcrumbs {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  min-width: 0;
}

.crumb-muted {
  color: var(--text-tertiary);
  font-size: var(--text-xs);
}

.crumb-current {
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.unsaved-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: var(--text-2xs);
  font-weight: 600;
  color: var(--signal-warn);
  background: var(--signal-warn-soft);
  padding: 2px 8px;
  border-radius: var(--radius-pill);
}

.topbar-controls {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex-shrink: 0;
}

/* --- Profile Hero Header --- */
.profile-header {
  padding: var(--space-5) var(--space-6) var(--space-4);
  border-bottom: 1px solid var(--border-subtle);
  background: var(--bg-canvas);
  display: flex;
  flex-direction: column;
  gap: var(--space-3-5);
  flex-shrink: 0;
}

.profile-header-main {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--space-4);
}

.profile-identity {
  display: flex;
  align-items: flex-start;
  gap: var(--space-3-5);
  min-width: 0;
}

.profile-avatar {
  width: 42px;
  height: 42px;
  border-radius: var(--radius-md);
  background: var(--bg-surface);
  border: 1px solid var(--border-default);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--accent);
  flex-shrink: 0;
}

.profile-avatar svg {
  width: 20px;
  height: 20px;
}

.profile-title-group {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.profile-title-row {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex-wrap: wrap;
}

.profile-heading {
  font-size: var(--text-xl);
  font-weight: 650;
  letter-spacing: -0.025em;
  line-height: 1.2;
  color: var(--text-primary);
  overflow-wrap: break-word;
  min-width: 0;
}

.tag-badge {
  font-size: var(--text-2xs);
  font-weight: 500;
  padding: 2px 8px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--border-subtle);
  background: var(--bg-surface);
  color: var(--text-secondary);
}

.latency-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--font-mono);
  font-size: var(--text-2xs);
  padding: 2px 8px;
  border-radius: var(--radius-pill);
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
}
.latency-chip.is-ok {
  color: var(--signal-live);
  border-color: var(--signal-live-soft);
  background: var(--signal-live-soft);
}
.latency-chip.is-fail {
  color: var(--signal-danger);
  background: var(--signal-danger-soft);
}

.profile-subtitle {
  font-size: var(--text-xs);
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex-wrap: wrap;
}

.profile-cta-cluster {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  flex-shrink: 0;
}

/* --- Sub-navigation Tabs & Secondary Actions --- */
.profile-nav-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
}

.segmented-tabs {
  display: inline-flex;
  align-items: center;
  padding: 3px;
  background: var(--bg-rail);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  gap: 2px;
}

.seg-tab {
  height: 27px;
  padding: 0 12px;
  border: none;
  border-radius: var(--radius-xs);
  background: transparent;
  color: var(--text-secondary);
  font-family: var(--font-sans);
  font-size: var(--text-xs);
  font-weight: 550;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  transition: background-color var(--dur-fast) var(--ease-out-expo), color var(--dur-fast) var(--ease-out-expo);
}

.seg-tab svg {
  width: 14px;
  height: 14px;
  flex-shrink: 0;
}

.seg-tab:hover {
  color: var(--text-primary);
}

.seg-tab.is-active {
  background: var(--bg-surface);
  color: var(--text-primary);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
}

.secondary-actions {
  display: flex;
  align-items: center;
  gap: 4px;
}

/* --- Buttons --- */
.btn {
  height: var(--control-md);
  padding: 0 var(--space-3);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-default);
  background: var(--bg-surface);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: var(--text-xs);
  font-weight: 550;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  cursor: pointer;
  white-space: nowrap;
  transition: background-color var(--dur-fast) var(--ease-out-expo), border-color var(--dur-fast) var(--ease-out-expo), transform var(--dur-fast) var(--ease-out-expo);
}

.btn svg {
  width: 14px;
  height: 14px;
  flex-shrink: 0;
}

.btn:hover:not(:disabled) {
  background: var(--bg-hover);
  border-color: var(--border-strong);
}

.btn:active:not(:disabled) {
  transform: scale(0.985);
}

.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.btn-sm {
  height: var(--control-sm);
  padding: 0 9px;
  font-size: var(--text-2xs);
}

.btn-ghost {
  border-color: transparent;
  background: transparent;
  color: var(--text-secondary);
}
.btn-ghost:hover:not(:disabled) {
  background: var(--bg-hover);
  border-color: transparent;
  color: var(--text-primary);
}

.btn-icon {
  width: var(--control-sm);
  height: var(--control-sm);
  padding: 0;
  border-color: transparent;
  background: transparent;
  color: var(--text-secondary);
}
.btn-icon svg {
  width: 15px;
  height: 15px;
}
.btn-icon:hover:not(:disabled) {
  background: var(--bg-hover);
  border-color: transparent;
  color: var(--text-primary);
}

.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--text-on-accent);
}
.btn-primary:hover:not(:disabled) {
  background: var(--accent-hover);
  border-color: var(--accent-hover);
}

.btn-live-active {
  background: var(--signal-live-soft);
  border-color: var(--signal-live);
  color: var(--signal-live);
}
.btn-live-active:hover:not(:disabled) {
  background: var(--signal-live-soft);
  border-color: var(--signal-live);
}

.btn-danger {
  color: var(--signal-danger);
}
.btn-danger:hover:not(:disabled) {
  background: var(--signal-danger-soft);
  border-color: var(--signal-danger);
  color: var(--signal-danger);
}

.kbd {
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 1px 5px;
  border-radius: 4px;
  background: rgba(128, 122, 110, 0.16);
  color: inherit;
  opacity: 0.85;
}

/* --- Content Body Scroll Pane --- */
.workspace-body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: var(--space-5) var(--space-6) var(--space-8);
}

.studio-grid {
  max-width: 880px;
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
}

/* --- Studio Section Panels --- */
.panel {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  overflow: hidden;
}

.panel-header {
  padding: var(--space-3-5) var(--space-4);
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
}

.panel-title-wrap {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.panel-title {
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--text-primary);
  letter-spacing: -0.01em;
}

.panel-desc {
  font-size: var(--text-xs);
  color: var(--text-tertiary);
}

.panel-body {
  padding: var(--space-4);
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}

/* --- Provider Preset Strip --- */
.preset-strip {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(144px, 1fr));
  gap: var(--space-2);
}

.preset-card {
  padding: 9px var(--space-2-5);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-subtle);
  background: var(--bg-canvas);
  color: var(--text-primary);
  cursor: pointer;
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 3px;
  transition: border-color var(--dur-fast) var(--ease-out-expo), background-color var(--dur-fast) var(--ease-out-expo);
}
.preset-card:hover {
  border-color: var(--border-strong);
  background: var(--bg-hover);
}
.preset-card.is-current {
  border-color: var(--accent);
  background: var(--accent-soft);
}
.preset-card-name {
  font-size: var(--text-xs);
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.preset-card-host {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-tertiary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* --- Form Fields --- */
.field-grid-2 {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--space-3-5);
}

@media (max-width: 780px) {
  .field-grid-2 {
    grid-template-columns: minmax(0, 1fr);
  }
}

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}

.field-label-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
}

.field-label {
  font-size: var(--text-xs);
  font-weight: 550;
  color: var(--text-secondary);
}

.field-key-hint {
  font-family: var(--font-mono);
  font-size: 10.5px;
  color: var(--text-tertiary);
}

.input, .select {
  width: 100%;
  height: var(--control-md);
  padding: 0 var(--space-3);
  background: var(--bg-inset);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: var(--text-sm);
  transition: border-color var(--dur-fast) var(--ease-out-expo);
}

.input.mono {
  font-family: var(--font-mono);
  font-size: var(--text-xs);
}

.input::placeholder {
  color: var(--text-tertiary);
}

.input:focus, .select:focus {
  outline: none;
  border-color: var(--border-focus);
}

.secret-group {
  display: flex;
  align-items: center;
  gap: 6px;
}

.secret-group .input {
  flex: 1;
}

/* --- Sync Mode Selector Cards --- */
.mode-cards {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--space-3);
}

.mode-card {
  padding: var(--space-3);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-subtle);
  background: var(--bg-canvas);
  cursor: pointer;
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 4px;
  transition: border-color var(--dur-fast) var(--ease-out-expo), background-color var(--dur-fast) var(--ease-out-expo);
}
.mode-card:hover {
  border-color: var(--border-strong);
}
.mode-card.is-selected {
  border-color: var(--accent);
  background: var(--accent-soft);
}
.mode-card-title {
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.mode-card-desc {
  font-size: var(--text-2xs);
  color: var(--text-secondary);
  line-height: 1.45;
}

/* --- Toggle Switch Rows --- */
.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
  padding: var(--space-2) 0;
  border-top: 1px solid var(--border-subtle);
}
.toggle-row:first-child {
  border-top: none;
  padding-top: 0;
}

.toggle-info {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.toggle-title {
  font-size: var(--text-sm);
  font-weight: 500;
  color: var(--text-primary);
}
.toggle-sub {
  font-size: var(--text-xs);
  color: var(--text-tertiary);
}

.switch {
  position: relative;
  width: 38px;
  height: 22px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--border-strong);
  background: var(--bg-inset);
  cursor: pointer;
  flex-shrink: 0;
  transition: background-color var(--dur-fast) var(--ease-out-expo), border-color var(--dur-fast) var(--ease-out-expo);
}
.switch::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 16px;
  height: 16px;
  border-radius: var(--radius-pill);
  background: var(--text-secondary);
  transition: transform var(--dur-fast) var(--ease-out-expo), background-color var(--dur-fast) var(--ease-out-expo);
}
.switch.is-on {
  background: var(--accent);
  border-color: var(--accent);
}
.switch.is-on::after {
  transform: translateX(16px);
  background: var(--text-on-accent);
}

/* --- Custom Env KV Table --- */
.kv-list {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.kv-row {
  display: grid;
  grid-template-columns: minmax(160px, 1fr) minmax(180px, 1.4fr) auto;
  gap: var(--space-2);
  align-items: center;
}

/* --- JSON Code Editor Pane --- */
.code-pane-wrap {
  height: calc(100vh - 235px);
  min-height: 320px;
  display: flex;
  flex-direction: column;
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  overflow: hidden;
}

.code-toolbar {
  padding: var(--space-2) var(--space-3-5);
  border-bottom: 1px solid var(--border-subtle);
  background: var(--bg-rail);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
}

.json-status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: var(--text-xs);
  font-weight: 550;
}
.json-status.is-valid {
  color: var(--signal-live);
}
.json-status.is-invalid {
  color: var(--signal-danger);
}

.code-editor-container {
  position: relative;
  flex: 1;
  display: grid;
  grid-template-columns: 52px minmax(0, 1fr);
  min-height: 0;
  background: var(--bg-inset);
}

.code-gutter {
  padding: var(--space-3-5) var(--space-2-5) var(--space-6) 0;
  text-align: right;
  font-family: var(--font-mono);
  font-size: 12.5px;
  line-height: 21px;
  color: var(--text-tertiary);
  background: var(--bg-rail);
  border-right: 1px solid var(--border-subtle);
  overflow: hidden;
  user-select: none;
}

.code-textarea {
  width: 100%;
  height: 100%;
  padding: var(--space-3-5) var(--space-4) var(--space-6);
  border: none;
  resize: none;
  background: transparent;
  color: var(--text-primary);
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 21px;
  tab-size: 2;
  white-space: pre;
  overflow: auto;
  user-select: text;
}
.code-textarea:focus {
  outline: none;
}

/* --- Effective Diff Viewer --- */
.diff-wrap {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

.diff-explainer {
  padding: var(--space-3) var(--space-4);
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
  flex-wrap: wrap;
}

.diff-table-card {
  background: var(--bg-inset);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  overflow: hidden;
}

.diff-header-bar {
  padding: var(--space-2) var(--space-3-5);
  background: var(--bg-rail);
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-family: var(--font-mono);
  font-size: var(--text-2xs);
  color: var(--text-secondary);
}

.diff-lines {
  font-family: var(--font-mono);
  font-size: 12.5px;
  line-height: 20px;
  overflow-x: auto;
  padding: var(--space-2) 0;
  user-select: text;
}

.diff-line {
  display: grid;
  grid-template-columns: 42px 42px 22px minmax(0, 1fr);
  padding: 0 var(--space-3);
}
.diff-line.is-add {
  background: var(--diff-add-bg);
  color: var(--diff-add-fg);
}
.diff-line.is-del {
  background: var(--diff-del-bg);
  color: var(--diff-del-fg);
}
.diff-line.is-ctx {
  color: var(--text-secondary);
}
.diff-ln {
  color: var(--text-tertiary);
  text-align: right;
  padding-right: 10px;
  user-select: none;
  font-variant-numeric: tabular-nums;
}
.diff-sig {
  user-select: none;
  text-align: center;
}
.diff-code {
  white-space: pre;
}

/* --- Empty State --- */
.empty-state {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: var(--space-8);
  gap: var(--space-3);
}

.empty-title {
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 500;
  color: var(--text-primary);
  letter-spacing: -0.015em;
}

.empty-desc {
  max-width: 42ch;
  font-size: var(--text-sm);
  color: var(--text-secondary);
}

/* --- Bottom Status Bar --- */
.statusbar {
  grid-column: 1 / -1;
  grid-row: 2;
  background: var(--bg-rail);
  border-top: 1px solid var(--border-subtle);
  padding: 0 var(--space-3-5);
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: var(--text-2xs);
  color: var(--text-tertiary);
}

.statusbar-group {
  display: flex;
  align-items: center;
  gap: var(--space-3);
}

.status-item {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

/* --- Modals & Command Palette (`⌘K`) --- */
.overlay {
  position: fixed;
  inset: 0;
  background: var(--bg-backdrop);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding-top: 11vh;
  z-index: 100;
  animation: fadeIn 140ms var(--ease-out-expo);
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes modalSlide {
  from { opacity: 0; transform: translateY(8px) scale(0.985); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.modal {
  width: min(560px, calc(100vw - 32px));
  max-height: 78vh;
  background: var(--bg-surface);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-overlay);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  animation: modalSlide 180ms var(--ease-out-expo);
}

.modal-lg {
  width: min(680px, calc(100vw - 32px));
}

.modal-header {
  padding: var(--space-4) var(--space-5);
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.modal-title {
  font-size: var(--text-md);
  font-weight: 600;
  letter-spacing: -0.015em;
}

.modal-body {
  padding: var(--space-4) var(--space-5);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}

.modal-footer {
  padding: var(--space-3) var(--space-5);
  border-top: 1px solid var(--border-subtle);
  background: var(--bg-rail);
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: var(--space-2);
}

/* Command Palette */
.cmd-input-wrap {
  display: flex;
  align-items: center;
  gap: var(--space-2-5);
  padding: 0 var(--space-4);
  height: 48px;
  border-bottom: 1px solid var(--border-subtle);
}
.cmd-input-wrap svg {
  width: 16px;
  height: 16px;
  color: var(--text-tertiary);
}
.cmd-input {
  flex: 1;
  border: none;
  background: transparent;
  color: var(--text-primary);
  font-family: var(--font-sans);
  font-size: var(--text-base);
}
.cmd-input:focus {
  outline: none;
}

.cmd-list {
  max-height: 340px;
  overflow-y: auto;
  padding: var(--space-2);
}
.cmd-item {
  width: 100%;
  padding: 9px var(--space-3);
  border: none;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  cursor: pointer;
  text-align: left;
  font-family: var(--font-sans);
  font-size: var(--text-sm);
}
.cmd-item:hover,
.cmd-item.is-active {
  background: var(--bg-hover);
}
.cmd-item-left {
  display: flex;
  align-items: center;
  gap: var(--space-2-5);
}
.cmd-item-left svg {
  width: 15px;
  height: 15px;
  color: var(--text-secondary);
}

/* Backup Snapshot Row */
.backup-row {
  padding: var(--space-3);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  background: var(--bg-canvas);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
}

/* Toast Stack */
.toast-stack {
  position: fixed;
  right: var(--space-4);
  bottom: calc(var(--statusbar-height) + var(--space-3));
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  z-index: 200;
  pointer-events: none;
}

.toast {
  pointer-events: auto;
  padding: 9px var(--space-3-5);
  background: var(--bg-elevated);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-toast);
  display: flex;
  align-items: center;
  gap: var(--space-2);
  font-size: var(--text-xs);

window.CCS_PARSE_FORM = function (jsonText) {
  let obj;
  try {
    obj = JSON.parse(jsonText || "{}");
    if (!obj || typeof obj !== "object" || Array.isArray(obj)) obj = {};
  } catch (err) {
    return { valid: false, error: err.message };

  const env = (obj.env && typeof obj.env === "object" && !Array.isArray(obj.env)) ? obj.env : {};
  const perms = (obj.permissions && typeof obj.permissions === "object") ? obj.permissions : {};

  let authMode = "auth_token";
  if (String(env.CLAUDE_CODE_USE_BEDROCK || "") === "1") {
    authMode = "bedrock";
  } else if (String(env.CLAUDE_CODE_USE_VERTEX || "") === "1") {
    authMode = "vertex";
  } else if (env.ANTHROPIC_AUTH_TOKEN !== undefined && env.ANTHROPIC_AUTH_TOKEN !== "") {
    authMode = "auth_token";
  } else if (env.ANTHROPIC_API_KEY !== undefined && env.ANTHROPIC_API_KEY !== "") {
    authMode = "api_key";
  } else if (env.ANTHROPIC_API_KEY === undefined && env.ANTHROPIC_AUTH_TOKEN === undefined) {
    authMode = "oauth_none";
  } else if (env.ANTHROPIC_API_KEY !== undefined) {
    authMode = "api_key";
  }

  const extraEnv = [];
  for (const [k, v] of Object.entries(env)) {
    if (!window.CCS_KNOWN_ENV_KEYS.has(k)) {
      extraEnv.push({ key: k, value: String(v ?? "") });
    }
  }

  return {
    valid: true,
    raw: obj,
    baseUrl: String(env.ANTHROPIC_BASE_URL ?? ""),
    authMode,
    apiKey: String(env.ANTHROPIC_API_KEY ?? ""),
    authToken: String(env.ANTHROPIC_AUTH_TOKEN ?? ""),

window.CCS_SERIALIZE_FORM = function (currentJsonText, patch) {

    else obj.model = m;

  if ("envModel" in patch) setOrDeleteEnv("ANTHROPIC_MODEL", patch.envModel.trim());
  if ("opusModel" in patch) setOrDeleteEnv("ANTHROPIC_DEFAULT_OPUS_MODEL", patch.opusModel.trim());
  if ("sonnetModel" in patch) setOrDeleteEnv("ANTHROPIC_DEFAULT_SONNET_MODEL", patch.sonnetModel.trim());
  if ("haikuModel" in patch) setOrDeleteEnv("ANTHROPIC_DEFAULT_HAIKU_MODEL", patch.haikuModel.trim());
  if ("fastModel" in patch) setOrDeleteEnv("ANTHROPIC_SMALL_FAST_MODEL", patch.fastModel.trim());
  if ("maxOutputTokens" in patch) setOrDeleteEnv("CLAUDE_CODE_MAX_OUTPUT_TOKENS", patch.maxOutputTokens.trim());
  if ("disableTraffic" in patch) {
    setOrDeleteEnv("CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC", patch.disableTraffic ? "1" : "");
  }
  if ("alwaysThinking" in patch) {
    if (patch.alwaysThinking) obj.alwaysThinkingEnabled = true;
    else delete obj.alwaysThinkingEnabled;
  }
  if ("defaultPermMode" in patch) {
    const pm = patch.defaultPermMode.trim();
    if (!pm) {
      if (obj.permissions && typeof obj.permissions === "object") {
        delete obj.permissions.defaultMode;
        if (Object.keys(obj.permissions).length === 0) delete obj.permissions;
      }
    } else {
      if (!obj.permissions || typeof obj.permissions !== "object") obj.permissions = {};
      obj.permissions.defaultMode = pm;
    }
  }

  if ("extraEnv" in patch && Array.isArray(patch.extraEnv)) {
    for (const k of Object.keys(obj.env)) {
      if (!window.CCS_KNOWN_ENV_KEYS.has(k)) {
        delete obj.env[k];
      }
    }
    for (const row of patch.extraEnv) {
      const k = (row.key || "").trim();
      if (k) obj.env[k] = String(row.value ?? "");
    }
  }

  return JSON.stringify(obj, null, 2);
};

   Claude Code Switcher v2.0 — Line-by-Line LCS Diff & Secret Redactor
   ========================================================================== */

window.CCS_MASK_SECRETS_IN_JSON = function (jsonText) {
  if (!jsonText) return "";
  return jsonText.replace(
    /("(?:ANTHROPIC_API_KEY|ANTHROPIC_AUTH_TOKEN|OPENAI_API_KEY|API_KEY|TOKEN|SECRET)"\s*:\s*")([^"]+)(")/gi,
    (_, p1, secret, p3) => {
      if (secret.length <= 8) return `${p1}••••••••${p3}`;
      return `${p1}${secret.slice(0, 6)}••••••${secret.slice(-4)}${p3}`;
    }
  );
};

window.CCS_COMPUTE_DIFF = function (beforeStr, afterStr) {
  const a = (beforeStr || "{}").split("\n");
  const b = (afterStr || "{}").split("\n");
  const n = a.length;
  const m = b.length;

  // Guard for very large files: fallback simple comparison above 600 lines
  if (n * m > 360000) {
    const out = [];
    const maxLen = Math.max(n, m);
    for (let i = 0; i < maxLen; i++) {
      if (a[i] === b[i]) {
        out.push({ type: "ctx", oldLn: i + 1, newLn: i + 1, text: a[i] });
      } else {
        if (i < n) out.push({ type: "del", oldLn: i + 1, newLn: "", text: a[i] });
        if (i < m) out.push({ type: "add", oldLn: "", newLn: i + 1, text: b[i] });
      }
    }
    return out;
  }

  const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) {
      if (a[i] === b[j]) {
        dp[i][j] = dp[i + 1][j + 1] + 1;
      } else {
        dp[i][j] = dp[i + 1][j] >= dp[i][j + 1] ? dp[i + 1][j] : dp[i][j + 1];
      }
    }
  }

  const ops = [];
  let i = 0;
  let j = 0;
  let oldLn = 1;
  let newLn = 1;
  while (i < n && j < m) {
    if (a[i] === b[j]) {
      ops.push({ type: "ctx", oldLn: oldLn++, newLn: newLn++, text: a[i] });
      i++;
      j++;
    } else if (dp[i + 1][j] >= dp[i][j + 1]) {
      ops.push({ type: "del", oldLn: oldLn++, newLn: "", text: a[i] });
      i++;
    } else {
      ops.push({ type: "add", oldLn: "", newLn: newLn++, text: b[j] });
      j++;
    }
  }
  while (i < n) {
    ops.push({ type: "del", oldLn: oldLn++, newLn: "", text: a[i++] });
  }
  while (j < m) {
    ops.push({ type: "add", oldLn: "", newLn: newLn++, text: b[j++] });
  }
  return ops;
};

    },
    paletteQuery: "",
    paletteIndex: 0
  };

  function escapeHtml(str) {
    return String(str ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function showToast(message, kind = "success") {
    const stack = document.getElementById("toast-stack");
    if (!stack) return;
    const el = document.createElement("div");
    el.className = `toast is-${kind}`;
    const iconSvg = kind === "error" ? ICONS.alert : kind === "warn" ? ICONS.alert : ICONS.check;
    el.innerHTML = `<span style="display:inline-flex;width:15px;height:15px">${iconSvg}</span><span>${escapeHtml(message)}</span>`;
    stack.appendChild(el);
    setTimeout(() => {
      el.style.opacity = "0";
      el.style.transition = "opacity 180ms ease";
      setTimeout(() => el.remove(), 200);
    }, 2800);
  }

  function applyTheme(themeStr) {
    const isLight = String(themeStr).toLowerCase() === "light";
    document.documentElement.setAttribute("data-theme", isLight ? "light" : "dark");
  }

  function currentSelectedProfile() {
    if (!ui.workspace || !ui.selectedFile) return null;
    return ui.workspace.profiles.find((p) => p.fileName === ui.selectedFile) || null;
  }

  function loadProfileIntoDraft(profile) {
    if (!profile) {
      ui.selectedFile = null;
      ui.draftContent = "";
      ui.isDirty = false;
      return;
    }
    ui.selectedFile = profile.fileName;
    ui.draftContent = profile.content;
    ui.draftProvider = profile.provider || "anthropic";
    ui.draftDescription = profile.description || "";
    ui.draftSyncMode = profile.syncMode || "merge";
    ui.draftPinned = Boolean(profile.pinned);
    ui.revealSecret = false;
    ui.isDirty = false;
  }

  function recomputeDirty() {
    const p = currentSelectedProfile();
    if (!p) {
      ui.isDirty = false;
      return;
    }
    ui.isDirty =
      ui.draftContent !== p.content ||
      ui.draftProvider !== (p.provider || "anthropic") ||
      ui.draftDescription !== (p.description || "") ||
      ui.draftSyncMode !== (p.syncMode || "merge") ||
      ui.draftPinned !== Boolean(p.pinned);
  }

  function syncWorkspaceState(nextWorkspace, preferredFileName = null) {
    ui.workspace = nextWorkspace;
    applyTheme(nextWorkspace.settings.theme);

    const shell = document.getElementById("app-shell");
    if (shell) {
      if (nextWorkspace.platform === "macos" && isNative) {
        shell.classList.add("app-Shell-macos");
      } else {
        shell.classList.remove("app-Shell-macos");
      }
    }

    const targetFile = preferredFileName || ui.selectedFile || nextWorkspace.settings.default_config_file;
    let found = nextWorkspace.profiles.find((p) => p.fileName === targetFile);
    if (!found && nextWorkspace.profiles.length > 0) {
      found = nextWorkspace.profiles[0];
    }

    if (!found) {
      loadProfileIntoDraft(null);
    } else if (found.fileName !== ui.selectedFile || !ui.isDirty) {
      loadProfileIntoDraft(found);
    }
    renderAll();
  }

  // --- Actions ---
  async function handleSaveCurrent() {
    const p = currentSelectedProfile();
    if (!p) return false;
    try {
      const parsed = JSON.parse(ui.draftContent);
      const formatted = JSON.stringify(parsed, null, 2);
      ui.draftContent = formatted;
    } catch (err) {
      showToast(`JSON 语法错误，无法保存: ${err.message}`, "error");
      return false;
    }
    try {
      const next = await rpc("save_profile", {
        fileName: p.fileName,
        content: ui.draftContent,
        provider: ui.draftProvider,
        description: ui.draftDescription,
        syncMode: ui.draftSyncMode,
        pinned: ui.draftPinned
      });
      ui.isDirty = false;
      syncWorkspaceState(next, p.fileName);
      showToast(
        p.isActive ? `已保存「${p.displayName}」并实时同步至 Claude Code` : `已保存配置「${p.displayName}」`,
        "success"
      );
      return true;
    } catch (err) {
      showToast(`保存失败: ${err.message}`, "error");
      return false;
    }
  }

  async function handleActivateProfile(fileName) {
    const target = ui.workspace.profiles.find((p) => p.fileName === fileName);
    if (!target) return;

    if (fileName === ui.selectedFile && ui.isDirty) {
      const saved = await handleSaveCurrent();
      if (!saved) return;
    }

    try {
      const next = await rpc("activate_profile", {
        fileName,
        syncModeOverride: fileName === ui.selectedFile ? ui.draftSyncMode : undefined
      });
      syncWorkspaceState(next, fileName);
      showToast(`已切换至「${target.displayName}」· ~/.claude/settings.json 已生效`, "success");
    } catch (err) {
      showToast(`切换配置失败: ${err.message}`, "error");
    }
  }

  async function handleProbeCurrent() {
    const p = currentSelectedProfile();
    if (!p || ui.probing) return;
    const form = window.CCS_PARSE_FORM(ui.draftContent);
    if (!form.valid) {
      showToast("当前 JSON 格式有误，请先修复后再测速", "warn");
      return;
    }
    const baseUrl = form.baseUrl || "https://api.anthropic.com";
    ui.probing = true;
    renderWorkspaceHeaderOnly();
    try {
      const res = await rpc("probe_endpoint", {
        fileName: p.fileName,
        baseUrl,
        apiKey: form.apiKey,
        authToken: form.authToken
      });
      const fresh = await rpc("get_state");
      ui.probing = false;
      ui.workspace = fresh;
      renderRailListOnly();
      renderWorkspaceHeaderOnly();
      if (res.reachable) {
        showToast(`网关连通正常: ${res.latencyMs} ms (${res.detail})`, "success");
      } else {
        showToast(`连接不可达: ${res.detail}`, "error");
      }
    } catch (err) {
      ui.probing = false;
      renderWorkspaceHeaderOnly();
      showToast(`测速出错: ${err.message}`, "error");
    }
  }

  async function handleToggleTheme() {
    if (!ui.workspace) return;
    const nextTheme = ui.workspace.settings.theme === "Light" ? "Dark" : "Light";
    try {
      const next = await rpc("update_settings", { theme: nextTheme });
      syncWorkspaceState(next, ui.selectedFile);
    } catch (err) {
      showToast(err.message, "error");
    }
  }

  function openNewProfileWizard(defaultPresetId = "anthropic") {
    const preset = PRESETS.find((x) => x.id === defaultPresetId) || PRESETS[0];
    const tpl = preset.template || {};
    const env = tpl.env || {};
    ui.newWizard = {
      presetId: preset.id,
      name: preset.name,
      description: preset.description,
      baseUrl: env.ANTHROPIC_BASE_URL || "",
      secret: "",
      model: tpl.model || env.ANTHROPIC_MODEL || "",
      syncMode: ui.workspace?.settings?.default_sync_mode || "merge",
      activateNow: true
    };
    ui.modal = "new";
    renderModal();
    requestAnimationFrame(() => {
      const el = document.getElementById("wiz-name-input");
      if (el) el.focus();
    });
  }

  async function openBackupsModal() {
    try {
      ui.backupsList = await rpc("list_backups");
      ui.previewBackupId = ui.backupsList[0]?.id || null;
      ui.modal = "backups";
      renderModal();
    } catch (err) {
      showToast(`读取备份历史失败: ${err.message}`, "error");
    }
  }

  function openSettingsModal() {
    if (!ui.workspace) return;
    ui.settingsDraft = {
      configDirectory: ui.workspace.settings.config_directory,
      defaultSyncMode: ui.workspace.settings.default_sync_mode || "merge",
      autoBackup: ui.workspace.settings.auto_backup !== false
    };
    ui.modal = "settings";
    renderModal();
  }

  function openCommandPalette() {
    ui.paletteQuery = "";
    ui.paletteIndex = 0;
    ui.modal = "palette";
    renderModal();
    requestAnimationFrame(() => {
      const el = document.getElementById("cmd-palette-input");
      if (el) el.focus();
    });
  }

  // --- Partial & Full Renderers ---
  function renderAll() {
    renderRail();
    renderWorkspace();
    renderStatusBar();
    renderModal();
  }

  function renderRail() {
    const rail = document.getElementById("rail-root");
    if (!rail || !ui.workspace) return;
    const { liveStatus, settings } = ui.workspace;
    const isLight = settings.theme === "Light";

    let statusPillClass = "is-missing";
    let statusLabel = "未托管";
    if (liveStatus.syncState === "synced") {
      statusPillClass = "is-synced";
      statusLabel = "实时已同步";
    } else if (liveStatus.syncState === "drifted") {
      statusPillClass = "is-drifted";
      statusLabel = "检测到外部变更";
    } else if (!liveStatus.exists) {
      statusPillClass = "is-missing";
      statusLabel = "尚未生成配置";
    }

    rail.innerHTML = `
      <div class="rail-titlebar" data-drag-region="true">
        <div class="brand-lockup" data-drag-region="true">
          <span class="brand-mark">${ICONS.brandSwitch}</span>
          <span class="brand-title" data-drag-region="true">Claude Switcher</span>
        </div>
        <div class="rail-actions">
          <button class="btn btn-icon" id="btn-cmd-palette" title="命令面板 (⌘K)">${ICONS.command}</button>
          <button class="btn btn-icon" id="btn-theme-toggle" title="切换深浅主题">${isLight ? ICONS.moon : ICONS.sun}</button>
          <button class="btn btn-icon" id="btn-open-settings" title="应用设置 (⌘,)">${ICONS.settings}</button>
        </div>
      </div>

      <div class="live-card">
        <div class="live-card-top">
          <span style="font-size:var(--text-2xs);font-weight:600;color:var(--text-secondary)">~/.claude/settings.json</span>
          <span class="live-pill ${statusPillClass}"><span class="pulse-dot"></span>${statusLabel}</span>
        </div>
        <div class="live-meta">
          <span class="live-host" title="${escapeHtml(liveStatus.activeHost)}">${escapeHtml(liveStatus.activeHost || "未设置网关")}</span>
          <span class="tabular" style="font-size:var(--text-2xs)">${escapeHtml(liveStatus.activeModel || "默认")}</span>
        </div>
        ${liveStatus.preservedSections && liveStatus.preservedSections.length > 0 ? `
          <div style="font-size:10.5px;color:var(--text-tertiary)">
            智能保护字段: ${liveStatus.preservedSections.map(escapeHtml).join(" · ")}
          </div>
        ` : ""}
        ${liveStatus.syncState === "drifted" || liveStatus.syncState === "unmanaged" ? `
          <div class="live-drift-bar">
            <button class="btn btn-sm" id="btn-import-live" style="flex:1">${ICONS.download} 捕获为配置</button>
            ${settings.default_config_file ? `<button class="btn btn-sm btn-primary" id="btn-reapply-active">重新覆盖同步</button>` : ""}
          </div>
        ` : ""}
      </div>

      <div class="rail-toolbar">
        <div class="search-box">
          ${ICONS.search}
          <input type="text" class="search-input" id="rail-search-input" placeholder="搜索环境 / 网关 (⌘F)" value="${escapeHtml(ui.searchQuery)}" />
          <button class="search-clear" id="rail-search-clear" style="${ui.searchQuery ? "" : "display:none"}" title="清空搜索">${ICONS.close}</button>
        </div>
        <button class="btn btn-sm btn-primary" id="btn-new-profile" title="新建配置 (⌘N)">${ICONS.plus} 新建</button>
      </div>

      <div class="profile-list" id="rail-profile-list"></div>
    `;

    renderRailListOnly();
    bindRailEvents();
  }

  function renderRailListOnly() {
    const container = document.getElementById("rail-profile-list");
    if (!container || !ui.workspace) return;
    const clearBtn = document.getElementById("rail-search-clear");
    if (clearBtn) clearBtn.style.display = ui.searchQuery ? "inline-flex" : "none";

    const q = ui.searchQuery.trim().toLowerCase();
    const filtered = ui.workspace.profiles.filter((p) => {
      if (!q) return true;
      return (
        p.displayName.toLowerCase().includes(q) ||
        p.baseHost.toLowerCase().includes(q) ||
        (p.description || "").toLowerCase().includes(q) ||
        (p.modelSummary || "").toLowerCase().includes(q)
      );
    });

    if (filtered.length === 0) {
      container.innerHTML = `
        <div style="padding:36px 16px;text-align:center;color:var(--text-tertiary);font-size:var(--text-xs)">
          ${ui.workspace.profiles.length === 0 ? "尚未创建任何环境配置" : "没有匹配的环境配置"}
        </div>
      `;
      return;
    }

    container.innerHTML = `
      <div class="rail-section-title">
        <span>配置环境 (${filtered.length})</span>
        <span class="tabular">双击快速激活</span>
      </div>
      ${filtered.map((p) => {
        const isSel = p.fileName === ui.selectedFile;
        const cls = [
          "profile-item",
          isSel ? "is-selected" : "",
          p.isActive ? "is-active-live" : ""
        ].filter(Boolean).join(" ");
        return `
          <div class="${cls}" tabindex="0" role="button" data-profile-file="${escapeHtml(p.fileName)}">
            <div class="provider-badge">${escapeHtml(window.CCS_PROVIDER_MONOGRAM(p.provider))}</div>
            <div class="profile-item-body">
              <div class="profile-item-title-row">
                <span class="profile-item-name">${escapeHtml(p.displayName)}</span>
                ${p.pinned ? `<span class="pin-icon" title="已置顶">${ICONS.pin}</span>` : ""}
              </div>
              <div class="profile-item-sub">
                <span class="profile-item-host">${escapeHtml(p.baseHost)}</span>
                ${p.lastLatencyMs ? `<span class="tabular" style="white-space:nowrap;flex-shrink:0">· ${p.lastLatencyMs}ms</span>` : ""}
              </div>
            </div>
            <div class="profile-item-right">
              ${p.isActive
                ? `<span class="active-dot-badge"><span class="pulse-dot"></span>生效</span>`
                : `<button class="quick-switch-btn" data-quick-activate="${escapeHtml(p.fileName)}" title="立即切换到此配置">启用</button>`
              }
            </div>
          </div>
        `;
      }).join("")}
    `;

    container.querySelectorAll("[data-profile-file]").forEach((row) => {
      row.addEventListener("click", (e) => {
        const quick = e.target.closest("[data-quick-activate]");
        if (quick) {
          e.stopPropagation();
          handleActivateProfile(quick.getAttribute("data-quick-activate"));
          return;
        }
        const fn = row.getAttribute("data-profile-file");
        if (fn === ui.selectedFile) return;
        const target = ui.workspace.profiles.find((x) => x.fileName === fn);
        if (target) {
          loadProfileIntoDraft(target);
          renderRailListOnly();
          renderWorkspace();
          renderStatusBar();
        }
      });
      row.addEventListener("dblclick", () => {
        const fn = row.getAttribute("data-profile-file");
        handleActivateProfile(fn);
      });
      row.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          const fn = row.getAttribute("data-profile-file");
          const target = ui.workspace.profiles.find((x) => x.fileName === fn);
          if (target) {
            loadProfileIntoDraft(target);
            renderRailListOnly();
            renderWorkspace();
          }
        }
      });
    });
  }

  function bindRailEvents() {
    document.getElementById("btn-cmd-palette")?.addEventListener("click", openCommandPalette);
    document.getElementById("btn-theme-toggle")?.addEventListener("click", handleToggleTheme);
    document.getElementById("btn-open-settings")?.addEventListener("click", openSettingsModal);
    document.getElementById("btn-new-profile")?.addEventListener("click", () => openNewProfileWizard("anthropic"));

    const searchInput = document.getElementById("rail-search-input");
    searchInput?.addEventListener("input", (e) => {
      ui.searchQuery = e.target.value;
      renderRailListOnly();
    });
    document.getElementById("rail-search-clear")?.addEventListener("click", () => {
      ui.searchQuery = "";
      if (searchInput) {
        searchInput.value = "";
        searchInput.focus();
      }
      renderRailListOnly();
    });

    document.getElementById("btn-import-live")?.addEventListener("click", async () => {
      try {
        const next = await rpc("import_live_config", { mode: "new_profile" });
        syncWorkspaceState(next);
        showToast("已将当前 ~/.claude/settings.json 捕获为新配置", "success");
      } catch (err) {
        showToast(err.message, "error");
      }
    });

    document.getElementById("btn-reapply-active")?.addEventListener("click", () => {
      if (ui.workspace?.settings?.default_config_file) {
        handleActivateProfile(ui.workspace.settings.default_config_file);
      }
    });
  }

  function renderWorkspace() {
    const root = document.getElementById("workspace-root");
    if (!root || !ui.workspace) return;
    const p = currentSelectedProfile();

    if (!p) {
      root.innerHTML = `
        <div class="workspace-topbar" data-drag-region="true">
          <div class="topbar-breadcrumbs" data-drag-region="true">
            <span class="crumb-muted">工作台</span>
          </div>
          <div class="topbar-controls">
            <button class="btn btn-sm btn-ghost" id="ws-btn-backups">${ICONS.history} 历史快照 (${ui.workspace.backupsCount})</button>
          </div>
        </div>
        <div class="empty-state">
          <div class="profile-avatar" style="width:52px;height:52px">${ICONS.brandSwitch}</div>
          <h1 class="empty-title">选择一个环境，或从官方预设开始</h1>
          <p class="empty-desc">支持 Anthropic 官方、OpenRouter、DeepSeek、智谱 GLM、Kimi、AWS Bedrock 与自建中转网关，切换时默认智能保护您的 Hooks 与权限配置。</p>
          <div style="display:flex;gap:10px;margin-top:8px">
            <button class="btn btn-primary" id="empty-btn-new">${ICONS.plus} 新建预设配置</button>
            <button class="btn" id="empty-btn-import">${ICONS.download} 导入当前 Claude 配置</button>
          </div>
        </div>
      `;
      document.getElementById("ws-btn-backups")?.addEventListener("click", openBackupsModal);
      document.getElementById("empty-btn-new")?.addEventListener("click", () => openNewProfileWizard("anthropic"));
      document.getElementById("empty-btn-import")?.addEventListener("click", async () => {
        const next = await rpc("import_live_config", { mode: "new_profile" });
        syncWorkspaceState(next);
      });
      return;
    }

    root.innerHTML = `
      <div id="ws-header-slot"></div>
      <div class="workspace-body" id="ws-body-slot"></div>
    `;
    renderWorkspaceHeaderOnly();
    renderWorkspaceBodyOnly();
  }

  function renderWorkspaceHeaderOnly() {
    const slot = document.getElementById("ws-header-slot");
    const p = currentSelectedProfile();
    if (!slot || !p || !ui.workspace) return;

    const syncedAndActive = p.isActive && ui.workspace.liveStatus.syncState === "synced" && !ui.isDirty;
    const syncLabel = ui.draftSyncMode === "merge" ? "智能合并" : "完整覆盖";

    let latencyBadge = "";
    if (ui.probing) {
      latencyBadge = `<span class="latency-chip tabular">测速中…</span>`;
    } else if (p.lastLatencyMs !== null && p.lastLatencyMs !== undefined) {
      const okCls = p.lastProbeOk ? "is-ok" : "is-fail";
      latencyBadge = `<span class="latency-chip tabular ${okCls}" title="${escapeHtml(p.lastProbeDetail || "")}">${p.lastLatencyMs} ms</span>`;
    }

    slot.innerHTML = `
      <div class="workspace-topbar" data-drag-region="true">
        <div class="topbar-breadcrumbs" data-drag-region="true">
          <span class="crumb-muted" data-drag-region="true">环境配置 /</span>
          <span class="crumb-current" data-drag-region="true">${escapeHtml(p.fileName)}</span>
          ${ui.isDirty ? `<span class="unsaved-badge">● 未保存更改</span>` : ""}
        </div>
        <div class="topbar-controls">
          <button class="btn btn-sm btn-ghost" id="ws-btn-backups" title="查看与回滚自动备份快照">
            ${ICONS.history} 快照 <span class="tabular">(${ui.workspace.backupsCount})</span>
          </button>
          <button class="btn btn-sm btn-ghost" id="ws-btn-refresh" title="重新扫描磁盘配置">
            ${ICONS.refresh} 刷新
          </button>
        </div>
      </div>

      <div class="profile-header">
        <div class="profile-header-main">
          <div class="profile-identity">
            <div class="profile-avatar">${ICONS.sliders}</div>
            <div class="profile-title-group">
              <div class="profile-title-row">
                <h1 class="profile-heading">${escapeHtml(p.displayName)}</h1>
                <span class="tag-badge">${escapeHtml(syncLabel)}</span>
                ${latencyBadge}
              </div>
              <div class="profile-subtitle">
                <span class="mono">${escapeHtml(p.baseHost)}</span>
                <span>·</span>
                <span>${escapeHtml(ui.draftDescription || "未填写环境备注")}</span>
              </div>
            </div>
          </div>

          <div class="profile-cta-cluster">
            <button class="btn" id="btn-probe" ${ui.probing ? "disabled" : ""} title="检测 API 网关连通性与延迟">
              ${ICONS.radar} ${ui.probing ? "检测中…" : "连通测速"}
            </button>
            <button class="btn" id="btn-save-profile" ${ui.isDirty ? "" : "disabled"} title="保存当前配置 (⌘S)">
              ${ICONS.save} 保存 <span class="kbd">⌘S</span>
            </button>
            ${syncedAndActive
              ? `<button class="btn btn-live-active" id="btn-activate-profile" title="点击可强制重新写入 ~/.claude/settings.json">
                  ${ICONS.check} 当前生效中
                </button>`
              : `<button class="btn btn-primary" id="btn-activate-profile" title="将此环境应用到 ~/.claude/settings.json (⌘↵)">

            }

        <div class="profile-nav-row">
          <div class="segmented-tabs" role="tablist">

              ${ICONS.sliders} 可视化工作台
            </button>
            <button class="seg-tab ${ui.activeTab === "json" ? "is-active" : ""}" data-tab="json">
              ${ICONS.code} JSON 源码
            </button>
            <button class="seg-tab ${ui.activeTab === "diff" ? "is-active" : ""}" data-tab="diff">
              ${ICONS.gitDiff} 生效预览与差异
            </button>
          </div>

          <div class="secondary-actions">
            <button class="btn btn-sm btn-ghost" id="btn-pin-profile" title="${ui.draftPinned ? "取消置顶" : "置顶此配置"}">
              ${ICONS.pin} ${ui.draftPinned ? "已置顶" : "置顶"}
            </button>
            <button class="btn btn-sm btn-ghost" id="btn-dup-profile" title="克隆一份副本">
              ${ICONS.duplicate} 克隆
            </button>
            <button class="btn btn-sm btn-ghost" id="btn-rename-profile" title="重命名配置文件">
              ${ICONS.edit} 重命名
            </button>

              ${ICONS.trash} 删除
            </button>
          </div>
        </div>

  }

  function renderJsonTab(container) {
    const buildGutterLines = (txt) => {
      const count = Math.max(1, (txt || "").split("\n").length);
      let out = "";
      for (let i = 1; i <= count; i++) out += `${i}\n`;
      return out;
    };

    const validate = (txt) => {
      try {
        JSON.parse(txt);
        return { ok: true, msg: "JSON 语法有效" };
      } catch (err) {
        return { ok: false, msg: err.message };
      }
    };

    const v = validate(ui.draftContent);

    container.innerHTML = `
      <div class="code-pane-wrap">
        <div class="code-toolbar">
          <div class="json-status ${v.ok ? "is-valid" : "is-invalid"}" id="json-live-status">
            <span style="width:14px;height:14px;display:inline-flex">${v.ok ? ICONS.check : ICONS.alert}</span>
            <span id="json-live-msg">${escapeHtml(v.msg)}</span>
          </div>
          <div style="display:flex;gap:6px">
            <button class="btn btn-sm" id="btn-format-json">${ICONS.wand} 格式化 JSON <span class="kbd">⌘⇧F</span></button>
            <button class="btn btn-sm" id="btn-copy-json">${ICONS.copy} 复制全文</button>
          </div>
        </div>
        <div class="code-editor-container">
          <pre class="code-gutter tabular" id="code-gutter">${buildGutterLines(ui.draftContent)}</pre>
          <textarea class="code-textarea" id="code-textarea" spellcheck="false" autocomplete="off" autocapitalize="off">${escapeHtml(ui.draftContent)}</textarea>
        </div>
      </div>
    `;

    const ta = document.getElementById("code-textarea");
    const gutter = document.getElementById("code-gutter");
    const statusBox = document.getElementById("json-live-status");

    const updateEditorMeta = () => {
      if (!ta || !gutter || !statusBox) return;
      ui.draftContent = ta.value;
      gutter.textContent = buildGutterLines(ta.value);
      gutter.scrollTop = ta.scrollTop;
      const res = validate(ta.value);
      statusBox.className = `json-status ${res.ok ? "is-valid" : "is-invalid"}`;
      statusBox.innerHTML = `
        <span style="width:14px;height:14px;display:inline-flex">${res.ok ? ICONS.check : ICONS.alert}</span>
        <span>${escapeHtml(res.msg)}</span>
      `;
      recomputeDirty();
      renderWorkspaceHeaderOnly();
      renderStatusBar();
    };

    ta?.addEventListener("input", updateEditorMeta);
    ta?.addEventListener("scroll", () => {
      if (gutter && ta) gutter.scrollTop = ta.scrollTop;
    });
    ta?.addEventListener("keydown", (e) => {
      if (e.key === "Tab") {
        e.preventDefault();
        const start = ta.selectionStart;
        const end = ta.selectionEnd;
        ta.value = ta.value.substring(0, start) + "  " + ta.value.substring(end);
        ta.selectionStart = ta.selectionEnd = start + 2;
        updateEditorMeta();
      }
    });

    document.getElementById("btn-format-json")?.addEventListener("click", () => {
      try {
        const formatted = JSON.stringify(JSON.parse(ui.draftContent), null, 2);
        ui.draftContent = formatted;
        if (ta) ta.value = formatted;
        updateEditorMeta();
        showToast("已格式化为标准 2 空格缩进 JSON", "success");
      } catch (err) {
        showToast(`JSON 格式无效: ${err.message}`, "error");
      }
    });

    document.getElementById("btn-copy-json")?.addEventListener("click", async () => {
      await navigator.clipboard?.writeText(ui.draftContent);
      showToast("JSON 内容已复制", "success");
    });
  }

  function renderDiffTab(container, profile) {
    const liveRaw = ui.workspace?.liveStatus?.liveContent || "{}";
    const effectiveRaw = computeEffectiveJson(liveRaw, ui.draftContent, ui.draftSyncMode);

    const beforeDisplay = ui.maskDiffSecrets ? window.CCS_MASK_SECRETS_IN_JSON(liveRaw) : liveRaw;
    const afterDisplay = ui.maskDiffSecrets ? window.CCS_MASK_SECRETS_IN_JSON(effectiveRaw) : effectiveRaw;
    const ops = window.CCS_COMPUTE_DIFF(beforeDisplay, afterDisplay);

    const addedCount = ops.filter((o) => o.type === "add").length;
    const deletedCount = ops.filter((o) => o.type === "del").length;
    const identical = addedCount === 0 && deletedCount === 0;

    container.innerHTML = `
      <div class="diff-wrap">
        <div class="diff-explainer">
          <div style="display:flex;flex-direction:column;gap:3px">
            <div style="font-size:var(--text-sm);font-weight:600">
              切换后 <span class="mono">~/.claude/settings.json</span> 实际生效变更预览
            </div>
            <div style="font-size:var(--text-xs);color:var(--text-secondary)">
              当前同步模式为 <strong>${ui.draftSyncMode === "merge" ? "智能合并 (保留 Hooks / Permissions / Plugins)" : "完整覆盖"}</strong>
              ${identical ? " · 与线上文件完全一致，无任何差异" : ` · <span style="color:var(--signal-live)">+${addedCount} 行新增</span> / <span style="color:var(--signal-danger)">-${deletedCount} 行移除</span>`}
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <button class="btn btn-sm" id="btn-toggle-diff-mask">
              ${ui.maskDiffSecrets ? ICONS.eye : ICONS.eyeOff} ${ui.maskDiffSecrets ? "显示明文密钥" : "脱敏隐藏密钥"}
            </button>
          </div>
        </div>

        <div class="diff-table-card">
          <div class="diff-header-bar">
            <span>--- 当前 ~/.claude/settings.json</span>
            <span>+++ 激活「${escapeHtml(profile.displayName)}」后结果</span>
          </div>
          <div class="diff-lines">
            ${ops.map((row) => {
              const cls = row.type === "add" ? "is-add" : row.type === "del" ? "is-del" : "is-ctx";
              const sig = row.type === "add" ? "+" : row.type === "del" ? "-" : " ";
              return `
                <div class="diff-line ${cls}">
                  <span class="diff-ln">${row.oldLn}</span>
                  <span class="diff-ln">${row.newLn}</span>
                  <span class="diff-sig">${sig}</span>
                  <span class="diff-code">${escapeHtml(row.text)}</span>
                </div>
              `;
            }).join("")}
          </div>
        </div>
      </div>
    `;

    document.getElementById("btn-toggle-diff-mask")?.addEventListener("click", () => {
      ui.maskDiffSecrets = !ui.maskDiffSecrets;
      renderDiffTab(container, profile);
    });
  }
