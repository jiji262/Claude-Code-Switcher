                  <button class="btn btn-sm" id="btn-reveal-profiles">${ICONS.external} 打开配置库文件夹</button>
                  <button class="btn btn-sm" id="btn-reveal-claude">${ICONS.external} 定位 ~/.claude/settings.json</button>
                </div>
              ` : ""}
            </div>
            <div class="modal-footer">
              <button class="btn" id="set-cancel">取消</button>
              <button class="btn btn-primary" id="set-save">保存设置</button>
            </div>
          </div>
        </div>
      `;
      document.getElementById("modal-close")?.addEventListener("click", closeModal);
      document.getElementById("set-cancel")?.addEventListener("click", closeModal);
      document.getElementById("set-dir-input")?.addEventListener("input", (e) => { ui.settingsDraft.configDirectory = e.target.value; });
      document.getElementById("set-sync-mode")?.addEventListener("change", (e) => { ui.settingsDraft.defaultSyncMode = e.target.value; });
      document.getElementById("set-backup-sw")?.addEventListener("click", () => {
        ui.settingsDraft.autoBackup = !ui.settingsDraft.autoBackup;
        renderModal();
      });
      document.getElementById("btn-pick-folder")?.addEventListener("click", async () => {
        const res = await rpc("pick_directory");
        if (res && res.path) {
          ui.settingsDraft.configDirectory = res.path;
          renderModal();
        }
      });
      document.getElementById("btn-reveal-profiles")?.addEventListener("click", () => rpc("reveal_path", { target: "profiles_dir" }));
      document.getElementById("btn-reveal-claude")?.addEventListener("click", () => rpc("reveal_path", { target: "claude_config" }));
      document.getElementById("set-save")?.addEventListener("click", async () => {
        try {
          const next = await rpc("update_settings", {
            configDirectory: ui.settingsDraft.configDirectory.trim(),
            defaultSyncMode: ui.settingsDraft.defaultSyncMode,
            autoBackup: ui.settingsDraft.autoBackup
          });
          closeModal();
          syncWorkspaceState(next);
          showToast("应用设置已更新", "success");
        } catch (err) {
          showToast(err.message, "error");
        }
      });
    } else if (ui.modal === "palette") {
      renderCommandPaletteModal(root);
      return;
    }

    document.getElementById("modal-overlay")?.addEventListener("mousedown", (e) => {
      if (e.target.id === "modal-overlay") closeModal();
    });
  }

  function getPaletteCommands() {
    const items = [];
    if (ui.workspace) {
      for (const p of ui.workspace.profiles) {
        items.push({
          id: `act:${p.fileName}`,
          icon: ICONS.zap,
          title: `切换并激活: ${p.displayName}`,
          hint: p.baseHost,
          run: () => handleActivateProfile(p.fileName)
        });
      }
    }
    items.push(
      { id: "new", icon: ICONS.plus, title: "新建环境配置…", hint: "⌘N", run: () => openNewProfileWizard("anthropic") },
      { id: "probe", icon: ICONS.radar, title: "对当前配置执行连通性测速", hint: "Ping", run: () => handleProbeCurrent() },
      { id: "diff", icon: ICONS.gitDiff, title: "查看 ~/.claude/settings.json 生效差异对比", hint: "Diff", run: () => { ui.activeTab = "diff"; renderWorkspaceHeaderOnly(); renderWorkspaceBodyOnly(); } },
      { id: "backups", icon: ICONS.history, title: "打开时间机器自动备份快照…", hint: "Backups", run: () => openBackupsModal() },
      { id: "theme", icon: ICONS.sun, title: "切换深色 (Obsidian) / 浅色 (Parchment) 主题", hint: "Theme", run: () => handleToggleTheme() },
      { id: "settings", icon: ICONS.settings, title: "打开应用偏好设置…", hint: "⌘,", run: () => openSettingsModal() }
    );
    const q = ui.paletteQuery.trim().toLowerCase();
    if (!q) return items;
    return items.filter((it) => it.title.toLowerCase().includes(q) || it.hint.toLowerCase().includes(q));
  }

  function renderCommandPaletteModal(root) {
    const list = getPaletteCommands();
    if (ui.paletteIndex >= list.length) ui.paletteIndex = 0;

    root.innerHTML = `
      <div class="overlay" id="modal-overlay">
        <div class="modal" role="dialog" aria-modal="true">
          <div class="cmd-input-wrap">
            ${ICONS.search}
            <input id="cmd-palette-input" class="cmd-input" type="text" placeholder="输入环境名称立即切换，或执行命令…" value="${escapeHtml(ui.paletteQuery)}" autocomplete="off" />
            <span class="kbd">ESC</span>
          </div>
          <div class="cmd-list" id="cmd-palette-list"></div>
        </div>
      </div>
    `;

    const paintList = () => {
      const items = getPaletteCommands();
      const box = document.getElementById("cmd-palette-list");
      if (!box) return;
      if (items.length === 0) {
        box.innerHTML = `<div style="padding:18px;text-align:center;color:var(--text-tertiary);font-size:var(--text-xs)">无匹配命令</div>`;
        return;
      }
      box.innerHTML = items.map((it, idx) => `
        <button class="cmd-item ${idx === ui.paletteIndex ? "is-active" : ""}" data-cmd-idx="${idx}">
          <span class="cmd-item-left">${it.icon}<span>${escapeHtml(it.title)}</span></span>
          <span class="kbd">${escapeHtml(it.hint)}</span>
        </button>
      `).join("");
      box.querySelectorAll("[data-cmd-idx]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const item = items[Number(btn.getAttribute("data-cmd-idx"))];
          closeModal();
          item?.run();
        });
      });
    };

    paintList();
    const inp = document.getElementById("cmd-palette-input");
    inp?.addEventListener("input", (e) => {
      ui.paletteQuery = e.target.value;
      ui.paletteIndex = 0;
      paintList();
    });
    inp?.addEventListener("keydown", (e) => {
      const items = getPaletteCommands();
      if (e.key === "ArrowDown") {
        e.preventDefault();
        ui.paletteIndex = items.length ? (ui.paletteIndex + 1) % items.length : 0;
        paintList();
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        ui.paletteIndex = items.length ? (ui.paletteIndex - 1 + items.length) % items.length : 0;
        paintList();
      } else if (e.key === "Enter") {
        e.preventDefault();
        const chosen = items[ui.paletteIndex];
        closeModal();
        chosen?.run();
      }
    });

    document.getElementById("modal-overlay")?.addEventListener("mousedown", (e) => {
      if (e.target.id === "modal-overlay") closeModal();
    });
  }

  // --- Global Keyboard Shortcuts & Native Titlebar Drag ---
  window.addEventListener("keydown", (e) => {
    const mod = e.metaKey || e.ctrlKey;
    if (e.key === "Escape" && ui.modal) {
      e.preventDefault();
      closeModal();
      return;
    }
    if (mod && e.key.toLowerCase() === "k") {
      e.preventDefault();
      if (ui.modal === "palette") closeModal();
      else openCommandPalette();
      return;
    }
    if (mod && e.key.toLowerCase() === "s") {
      e.preventDefault();
      handleSaveCurrent();
      return;
    }
    if (mod && e.key === "Enter") {
      e.preventDefault();
      if (ui.selectedFile && !ui.modal) handleActivateProfile(ui.selectedFile);
      return;
    }
    if (mod && e.key.toLowerCase() === "n") {
      e.preventDefault();
      openNewProfileWizard("anthropic");
      return;
    }
    if (mod && e.key === ",") {
      e.preventDefault();
      openSettingsModal();
      return;
    }
    if (mod && e.key.toLowerCase() === "f" && !e.shiftKey) {
      const searchEl = document.getElementById("rail-search-input");
      if (searchEl && document.activeElement?.id !== "code-textarea") {
        e.preventDefault();
        searchEl.focus();
        searchEl.select();
      }
      return;
    }
    if (mod && e.shiftKey && e.key.toLowerCase() === "f") {
      if (ui.activeTab === "json") {
        e.preventDefault();
        document.getElementById("btn-format-json")?.click();
      }
    }
  });

  document.addEventListener("mousedown", (e) => {
    if (!isNative || e.button !== 0) return;
    if (e.target.closest("button, input, select, textarea, a, [role='button']")) return;
    if (e.target.closest("[data-drag-region]")) {
      rpc("window_action", { action: e.detail === 2 ? "toggle_maximize" : "drag" }).catch(() => {});
    }
  });

  // --- Boot ---
  async function boot() {
    try {
      const state = await rpc("get_state");
      let preferred = null;
      if (!isNative && window.location.search) {
        const params = new URLSearchParams(window.location.search);
        if (params.get("theme") === "light") state.settings.theme = "Light";
        if (params.get("theme") === "dark") state.settings.theme = "Dark";
        const tab = params.get("tab");
        if (tab === "studio" || tab === "json" || tab === "diff") ui.activeTab = tab;
        const sel = params.get("select");
        if (sel) {
          const match = state.profiles.find((p) => p.displayName.toLowerCase().includes(sel.toLowerCase()));
          if (match) preferred = match.fileName;
        }
      }
      syncWorkspaceState(state, preferred);
      if (!isNative && window.location.search) {
        const params = new URLSearchParams(window.location.search);
        if (params.get("modal") === "new") openNewProfileWizard("openrouter");
        if (params.get("modal") === "palette") openCommandPalette();
      }
    } catch (err) {
      showToast(`初始化失败: ${err.message}`, "error");
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();

  </script>
</body>
</html>
